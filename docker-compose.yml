services:
  postgres:
    image: postgres:16
    container_name: inkwell-postgres
    environment:
      POSTGRES_USER: inkwell
      POSTGRES_PASSWORD: inkwell
      POSTGRES_DB: inkwell
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inkwell"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
